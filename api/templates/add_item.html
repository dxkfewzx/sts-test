<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มวัสดุใหม่ | SYSTEMS IT</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f4f7fe;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }
        .form-card h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #2e384d;
        }
        .form-label {
            font-weight: 500;
            margin-bottom: 6px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #eee;
            background: #f8f9fc;
        }
        .btn-primary {
            background: #4e73df;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: 600;
            border-radius: 10px;
        }
        .btn-primary:hover {
            background: #224abe;
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: 600;
            border-radius: 10px;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
<div class="form-card">
    <h2>เพิ่มวัสดุใหม่</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('add_item') }}">
        <div class="mb-3">
            <label for="item_name" class="form-label">ชื่อวัสดุ *</label>
            <input type="text" class="form-control" id="item_name" name="item_name" required>
        </div>
        <div class="mb-3">
            <label for="category" class="form-label">ประเภท</label>
            <input type="text" class="form-control" id="category" name="category">
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">เพิ่มวัสดุ</button>
            <a href="{{ url_for('inventory_list') }}" class="btn btn-secondary">ยกเลิก</a>
        </div>
    </form>
</div>
</body>
</html>
